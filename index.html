<div
                class="error"
                data-error="5"
                style="
                position:absolute;
                right:30%;
                bottom:8%;
                width:70px;
                height:25px;
                border:2px solid #d6e1ed;
                background:#101923;
                ">
            </div>

        </div>

        <div id="message" class="message">
            اضغط على الأشياء التي تعتقد أنها غير منطقية.
        </div>

    </div>

</section>


<!-- النجاح -->

<section id="successScreen" class="screen hidden">

    <div class="success">

        <div class="success-icon">✓</div>

        <h2>أحسنت.</h2>

        <p>
            تم اكتشاف جميع الأخطاء.<br>
            يبدو أنك تستحق الانتقال للمرحلة التالية. 👀
        </p>

        <button class="main-btn" onclick="nextStage()">
            تابع
        </button>

    </div>

</section>


<script>

let found = 0;

function startProject(){

    document.getElementById("introScreen").classList.add("hidden");

    document.getElementById("stage1").classList.remove("hidden");

}


document.querySelectorAll(".error").forEach(function(error){

    error.addEventListener("click", function(){

        if(this.classList.contains("found")) return;

        this.classList.add("found");

        found++;

        document.getElementById("count").textContent = found;

        document.getElementById("message").textContent =
            "تم اكتشاف خلل ✓";

        if(found === 5){

            setTimeout(function(){

                document.getElementById("stage1").classList.add("hidden");

                document.getElementById("successScreen").classList.remove("hidden");

            },700);

        }

    });

});


function nextStage(){

    alert("المرحلة الثانية قادمة... 👀");

}

</script>

</body>
</html>
